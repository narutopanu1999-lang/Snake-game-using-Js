<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake-Game</title>
    <link  rel = "stylesheet" href = "style.css">
</head>
<body>
    <main>
        <!-- Top Stats Section -->
        <section class="top-stats">
            <div class="stat-item">
                <h3>Best Score:</h3>
                <span id="bestScore">0</span>
            </div>
            <div class="stat-item">
                <h3>Time:</h3>
                <span id="timer">00:00</span>
            </div>
            <div class="stat-item">
                <h3>Score:</h3>
                <span id="score">0</span>
            </div>
        </section>

        <!-- main Game with Controls -->
        <div class="game-wrapper">
            <!-- Left Side Controls -->
            <div class="side-controls left-controls">
                <div class="control-group">
                    <h4>Grid</h4>
                    <button class="side-btn" id="gridMinusBtn">−</button>
                    <span id="grid" class="control-value">20x20</span>
                    <button class="side-btn" id="gridPlusBtn">+</button>
                </div>
            </div>

            <!-- Game Board -->
            <div class="game-container">
                <Section class="board" id="board"></Section>

                <!-- Control Buttons -->
                <div class="control-buttons">
                    <button class="control-btn start-btn" id="startBtn">Start</button>
                    <button class="control-btn stop-btn" id="stopBtn" disabled>Stop</button>
                    <button class="control-btn restart-btn" id="restartBtn">Restart</button>
                </div>
            </div>

            <!-- Right Side Controls -->
            <div class="side-controls right-controls">
                <div class="control-group">
                    <h4>Speed</h4>
                    <input type="range" id="speedSlider" min="50" max="300" value="150" class="vertical-slider">
                    <span id="speedDisplay" class="control-value">150ms</span>
                </div>
            </div>
        </div>

        <!-- Game Over Modal -->
        <div class="game-over-modal" id="gameOverModal">
            <div class="game-over-content">
                <h1>GAME OVER!</h1>
                <div class="game-over-stats">
                    <p>Final Score: <span id="finalScore">0</span></p>
                    <p>Grid Size: <span id="finalGrid">20x20</span></p>
                    <p>Time: <span id="finalTime">00:00</span></p>
                </div>
                <button class="restart-modal-btn" id="restartModalBtn">Play Again</button>
            </div>
        </div>

    </main>
    <script src = "game.js"></script>
</body>
</html>
